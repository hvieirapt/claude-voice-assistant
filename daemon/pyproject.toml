[project]
name = "voz"
version = "0.1.0"
description = "Conversa por voz com o Claude Code, com STT e TTS locais"
authors = [
    { name = "Hugo Vieira" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "httpx>=0.28.1",
    "mlx-audio>=0.6.2",
    "mlx-lm>=0.32.2",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "parakeet-mlx>=0.5.3",
    "piper-tts>=1.8.0",
    "pysilero-vad>=3.4.0",
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
voz = "voz.app:main"
voz-daemon = "voz.daemon:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

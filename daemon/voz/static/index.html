<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voz</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e3df; --accent:#2f6fdd; --warn:#c0392b; --ok:#2e8b57; --me:#e8f0fe; --claude:#fff7e6; --spoken:#eef7ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ececea; --muted:#9a9a94; --card:#1f1f1c; --line:#33332f; --accent:#6ea0ff; --warn:#ff7b6b; --ok:#6bd19a; --me:#20304a; --claude:#3a2f1a; --spoken:#1f3326; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, system-ui, sans-serif; height:100vh; display:flex; flex-direction:column }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap }
  .state { font-weight:600; padding:4px 10px; border-radius:999px; background:var(--line); min-width:120px; text-align:center }
  .state[data-s="listening"]{background:var(--line)} .state[data-s="recording"]{background:var(--warn);color:#fff} .state[data-s="transcribing"],.state[data-s="thinking"]{background:var(--accent);color:#fff} .state[data-s="speaking"]{background:var(--ok);color:#fff} .state[data-s="muted"]{background:#888;color:#fff}
  .meter { width:140px; height:10px; background:var(--line); border-radius:5px; overflow:hidden } .meter i { display:block; height:100%; width:0; background:var(--ok); transition:width .08s }
  .info { color:var(--muted); font-size:13px; margin-left:auto } .info b { color:var(--fg); font-weight:500 }
  main { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px }
  .msg { max-width:820px; padding:8px 12px; border-radius:10px; white-space:pre-wrap; border:1px solid var(--line) }
  .me { background:var(--me); align-self:flex-end } .claude { background:var(--claude) } .spoken { background:var(--spoken); font-size:14px } .spoken::before { content:"♪ "; color:var(--ok) }
  .tool, .note { color:var(--muted); font-size:13px; padding:0 4px } .warn { color:var(--warn) } .done { color:var(--muted); font-size:12px; padding:0 4px }
  .cursor::after { content:"▍"; color:var(--accent); animation:b 1s infinite } @keyframes b { 50%{opacity:0} }
  footer { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); background:var(--card); align-items:center; flex-wrap:wrap }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer } button:active, button.on { background:var(--accent); color:#fff }
  #ptt { min-width:150px; font-weight:600 } #ptt.rec { background:var(--warn); color:#fff }
  input { flex:1; min-width:220px; font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg) }
  .hint { color:var(--muted); font-size:12px; width:100% }
</style>
</head>
<body>
<header>
  <span class="state" id="state" data-s="idle">a ligar…</span>
  <span class="meter"><i id="meter"></i></span>
  <span class="info">mic <b id="mic">?</b> · modelo <b id="model">?</b> · modo <b id="mode">auto</b> · sessão <b id="session">—</b></span>
</header>
<main id="log"></main>
<footer>
  <button id="ptt">🎙 carregar para falar</button>
  <button id="mute">🔇 silenciar mic</button>
  <button id="stop">⏹ parar</button>
  <input id="text" placeholder="ou escreve aqui e Enter…" autocomplete="off">
  <span class="hint" id="hint">Espaço (fora da caixa de texto) = carregar para falar. Em modo auto o botão também funciona e desliga a detecção automática enquanto estiver carregado.</span>
</footer>
<script>
const $ = s => document.querySelector(s), log = $('#log');
let current = null, lastLevelTs = 0;
function add(cls, text){ const d=document.createElement('div'); d.className=cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
function setState(s, label){ const e=$('#state'); e.dataset.s=s; e.textContent=label||s; }
const labels = {idle:'parado', listening:'a ouvir', recording:'a gravar', transcribing:'a transcrever', thinking:'Claude a pensar', speaking:'a falar', muted:'mic silenciado'};
function cmd(o){ return fetch('/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}); }

const es = new EventSource('/events');
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  switch(ev.type){
    case 'hello': $('#mic').textContent=ev.mic; $('#model').textContent=ev.model||'default'; $('#mode').textContent=ev.mode; $('#session').textContent=(ev.session||'nova').slice(0,8); setState('listening', labels.listening); break;
    case 'state': setState(ev.state, labels[ev.state]||ev.state); if(ev.state!=='thinking' && current){ current.classList.remove('cursor'); current=null; } break;
    case 'level': { const now=Date.now(); if(now-lastLevelTs>60){ $('#meter').style.width=Math.round(ev.v*100)+'%'; lastLevelTs=now; } break; }
    case 'user': add('msg me', ev.text); current=null; break;
    case 'delta': if(!current){ current=add('msg claude cursor',''); } current.textContent+=ev.text; log.scrollTop=log.scrollHeight; break;
    case 'block_end': if(current){ current.classList.remove('cursor'); current=null; } break;
    case 'spoken': add('msg spoken', ev.text); break;
    case 'tool': add('tool', '⚙ '+ev.text); break;
    case 'note': add('note'+(ev.warn?' warn':''), ev.text); break;
    case 'done': add('done', `✓ ${ev.secs}s · ${ev.turns} passos${ev.cost?' · '+ev.cost:''}`); break;
    case 'mode': $('#mode').textContent=ev.mode; break;
  }
};
es.onerror = () => setState('idle', 'sem ligação ao voz');

// push-to-talk: botão e tecla Espaço
let down=false;
function pttDown(){ if(down) return; down=true; $('#ptt').classList.add('rec'); cmd({type:'ptt', down:true}); }
function pttUp(){ if(!down) return; down=false; $('#ptt').classList.remove('rec'); cmd({type:'ptt', down:false}); }
const b=$('#ptt'); b.onmousedown=pttDown; b.onmouseup=pttUp; b.onmouseleave=pttUp; b.ontouchstart=e=>{e.preventDefault();pttDown()}; b.ontouchend=pttUp;
window.addEventListener('keydown', e=>{ if(e.code==='Space' && document.activeElement!==$('#text')){ e.preventDefault(); pttDown(); } });
window.addEventListener('keyup', e=>{ if(e.code==='Space' && document.activeElement!==$('#text')){ e.preventDefault(); pttUp(); } });

let muted=false;
$('#mute').onclick=()=>{ muted=!muted; $('#mute').classList.toggle('on',muted); $('#mute').textContent=muted?'🎙 ligar mic':'🔇 silenciar mic'; cmd({type:'mute', on:muted}); };
$('#stop').onclick=()=>cmd({type:'stop'});
$('#text').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.value.trim()){ cmd({type:'text', text:e.target.value.trim()}); e.target.value=''; } });
</script>
</body>
</html>
